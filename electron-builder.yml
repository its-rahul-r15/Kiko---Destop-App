appId: com.kiko.desktop
productName: Kiko
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: assets

files:
  - "src/**/*"
  - "pets/**/*"
  - "assets/**/*"
  - "package.json"

electronLanguages:
  - "en-US"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: assets/kiko.ico
  asar: true

nsis:
  installerIcon: assets/kiko.ico
  uninstallerIcon: assets/kiko.ico
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "Kiko"
