<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiko Notes</title>
  <link rel="stylesheet" href="notes.css">
</head>
<body>
  <main class="notes-app">
    <header class="notes-header">
      <div class="notes-brand">
        <img src="../../../assets/kiko.png" alt="" class="notes-brand-icon">
        <div>
          <div class="notes-title-row">
            <h1>Your notes</h1>
            <span id="notes-count" class="notes-count">0 notes</span>
          </div>
          <p>A little space for everything on your mind.</p>
        </div>
      </div>
      <div class="notes-actions">
        <span id="save-status" class="save-status" role="status" aria-live="polite">All changes saved</span>
        <button id="new-note" class="new-note-button" type="button">＋ <span>New note</span></button>
        <button id="close-window" class="close-button" type="button" aria-label="Close notes">×</button>
      </div>
    </header>
    <div class="notes-toolbar">
      <label class="search-box">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search-notes" type="search" placeholder="Find a note..." aria-label="Search notes">
        <kbd>Search</kbd>
      </label>
      <span class="notes-hint">Private to this PC <span aria-hidden="true">·</span> Auto-saved</span>
    </div>
    <section id="notes-board" class="notes-board" aria-label="Your sticky notes"></section>
    <template id="note-template">
      <article class="note-card">
        <header class="note-card-header">
          <span class="note-marker" aria-hidden="true"></span>
          <input class="note-title" type="text" maxlength="80" placeholder="Untitled note" aria-label="Note title">
          <label class="note-size-control">
            <span class="sr-only">Note size</span>
            <select class="note-size" aria-label="Note size">
              <option value="small">Small</option>
              <option value="medium">Medium</option>
              <option value="large">Large</option>
            </select>
          </label>
          <button class="delete-note" type="button" aria-label="Delete note" title="Delete note">×</button>
        </header>
        <textarea class="note-content" maxlength="5000" placeholder="Type a thought, a reminder, or anything you want to keep..." aria-label="Note"></textarea>
        <section class="note-todos" aria-label="To-do list">
          <div class="todo-heading">
            <span>To-do</span>
            <span class="todo-progress" aria-live="polite"></span>
          </div>
          <form class="todo-form">
            <input class="todo-input" type="text" maxlength="160" placeholder="Add a task..." aria-label="Add a task">
            <button class="todo-add" type="submit" aria-label="Add task">＋</button>
          </form>
          <ul class="todo-list"></ul>
        </section>
        <footer class="note-card-footer">Auto-saved on this PC</footer>
      </article>
    </template>
  </main>
  <script src="notes.js"></script>
</body>
</html>
