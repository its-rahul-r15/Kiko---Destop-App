<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; media-src 'self' file:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiko</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <div id="pet-root">
    <div id="speech-bubble" class="bubble-hidden" role="status" aria-live="polite">
      <div class="reminder-poster-heading">
        <div class="reminder-pet-art">
          <img id="reminder-pet-image" alt="">
        </div>
        <div class="reminder-poster-title">
          <span class="reminder-eyebrow">A LITTLE RESET</span>
          <strong>Water break</strong>
          <span class="reminder-subtitle">Your buddy is cheering you on</span>
        </div>
        <button id="dismiss-reminder" class="dismiss-reminder" type="button" aria-label="Dismiss reminder">×</button>
      </div>
      <div id="bubble-text">It's time to drink some water. 💧</div>
      <div class="reminder-poster-footer">
        <span aria-hidden="true">💧</span>
        <span>A sip now, a brighter rest of your day.</span>
      </div>
      <div class="reminder-poster-actions">
        <button id="snooze-reminder" type="button">Snooze 10 min</button>
        <button id="done-reminder" type="button">Done</button>
      </div>
    </div>

    <span id="spider-web" aria-hidden="true"></span>

    <!-- Character Sprite / Illustration Container -->
    <div id="pet-container" class="state-idle" role="button" tabindex="0" aria-label="Kiko, click for a reaction">
      <img id="pet-image" alt="Pet Character" draggable="false">
      <div id="sleep-zzz" class="zzz-hidden">
        <span class="z1">Z</span>
        <span class="z2">z</span>
        <span class="z3">z</span>
      </div>
    </div>
    <div id="pomodoro-badge" class="pomodoro-hidden" aria-live="polite"></div>
  </div>

  <audio id="reminder-audio" preload="auto"></audio>
  <script src="pet.js"></script>
</body>
</html>
